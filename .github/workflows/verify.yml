name: Verify readiness candidate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: redacted-verification
          path: |
            .wrangler/readiness-growth-measurements.json
            .wrangler/verify-server-*.log
            .wrangler/verify-runtime-*/.wrangler/capacity-results.json
          retention-days: 14
